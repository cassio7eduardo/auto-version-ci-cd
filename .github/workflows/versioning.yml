name: Auto-Version

on:
  push:
    branches:
      - main

jobs:
  auto-version:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Incrementar Versão
        run: |
          CURRENT_VERSION=$(cat version.txt)
          echo "Versão atual: $CURRENT_VERSION"

          CLEAN_VERSION=${CURRENT_VERSION#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
          echo "Nova versão: $NEW_VERSION"

          echo "$NEW_VERSION" > version.txt

      - name: Commit e Push da nova versão
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci-bot@users.noreply.github.com"
          
          git add version.txt
          git commit -m "github-actions[bot] Increment version [skip ci]"
          git push
